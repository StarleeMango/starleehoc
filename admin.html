<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Starlee Admin</title>
<style>
:root { --bg: #1d2038; --panel: #f3f0dc; --ink: #23264a; --soft: #565a7c; --sun: #f7c548; --low: #c8413c; --good: #1f8a5b; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 640px; margin: auto; display: grid; gap: 16px; }
h1 { color: #dfe2f5; font-size: 1.5rem; margin: 0; }
section { background: var(--panel); border: 4px solid #33375c; padding: 16px; display: grid; gap: 10px; }
h2 { margin: 0; font-size: 1.15rem; }
p { margin: 0; }
input { font: inherit; padding: 8px; border: 3px solid var(--ink); width: 100%; box-sizing: border-box; }
button { font: inherit; font-weight: 700; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); padding: 6px 12px; cursor: pointer; justify-self: start; }
button.del { background: none; border: 0; color: var(--low); text-decoration: underline; padding: 0; font-weight: 400; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { border-left: 4px solid var(--ink); padding-left: 10px; overflow-wrap: anywhere; }
small { color: var(--soft); }
.msg { min-height: 1.5em; color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Starlee admin</h1>
  <section>
    <h2>Admin key</h2>
    <p>Paste the ADMIN_TOKEN you set in Vercel. It stays in this browser only.</p>
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off">
    <button id="saveKey" type="button">Save key</button>
  </section>
  <section>
    <h2>Spotify</h2>
    <p id="spotifyState">Checking…</p>
    <button id="connect" type="button">Connect Spotify</button>
    <p class="msg" id="spotifyMsg" role="status"></p>
  </section>
  <section>
    <h2>Notes</h2>
    <p class="msg" id="notesMsg" role="status"></p>
    <ul id="notes"></ul>
  </section>
  <p><a href="/" style="color:#f7c548">Back to the site</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
let key = "";
try { key = localStorage.getItem("adminKey") || ""; } catch {}
$("key").value = key;
$("saveKey").addEventListener("click", () => {
  key = $("key").value.trim();
  try { localStorage.setItem("adminKey", key); } catch {}
  $("notesMsg").textContent = "Key saved.";
});

fetch("/api/music").then(r => r.json()).then(m => {
  $("spotifyState").textContent = m.connected ? "Connected. Reconnect only if songs stop updating." : "Not connected yet.";
}).catch(() => { $("spotifyState").textContent = "Couldn't check Spotify."; });

$("connect").addEventListener("click", async () => {
  $("spotifyMsg").textContent = "Opening Spotify…";
  const r = await fetch("/api/spotify/login", { method: "POST", headers: { Authorization: "Bearer " + key } });
  const j = await r.json().catch(() => ({}));
  if (r.ok && j.url) location.href = j.url;
  else $("spotifyMsg").textContent = j.error || "Couldn't start the Spotify sign-in.";
});

async function loadNotes() {
  const r = await fetch("/api/notes", { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  const box = $("notes"); box.textContent = "";
  (j.notes || []).forEach(n => {
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = n.name || "Anonymous";
    const s = document.createElement("small"); s.textContent = " " + new Date(n.at).toLocaleString();
    const p = document.createElement("p"); p.textContent = n.text;
    const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "Remove";
    del.addEventListener("click", async () => {
      const d = await fetch("/api/notes?id=" + encodeURIComponent(n.id), { method: "DELETE", headers: { Authorization: "Bearer " + key } });
      const dj = await d.json().catch(() => ({}));
      $("notesMsg").textContent = d.ok ? "Note removed." : (dj.error || "Couldn't remove the note.");
      if (d.ok) li.remove();
    });
    li.append(b, s, p, del);
    box.append(li);
  });
  if (!box.children.length) $("notesMsg").textContent = "No notes yet.";
}
loadNotes();
</script>
</body>
</html>
